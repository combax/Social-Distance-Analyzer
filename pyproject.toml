[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-distance-analyzer"
version = "2.0.0"
description = "People detection, bird's-eye distance estimation and its evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python>=4.10,<5",  # 5.x removed cv2.dnn.readNetFromDarknet (the YOLOv3 baseline)
    "ultralytics>=8.4",
    "torch>=2.4",  # CUDA build: uv pip install torch --index-url https://download.pytorch.org/whl/cu128
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pycocotools>=2.0.8",
    "trackeval @ git+https://github.com/JonathonLuiten/TrackEval@12c8791b303e0a0b50f753af204249e622d0281a",
]

[tool.setuptools]
packages = ["sda", "evaluation"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.15", "mypy>=1.13", "pandas-stubs"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "ANN"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
strict = true
disallow_any_explicit = true  # code-quality gate: name the real type
files = ["sda", "evaluation"]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "scipy.*", "pycocotools.*", "trackeval.*", "motmetrics.*", "matplotlib.*", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ["if __name__ == \"__main__\":"]
